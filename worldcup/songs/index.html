스피커를 켜요."],["월요일 아침, 알람을 다섯 번 껐어요.","눈 떠 보니 8시 10분. 머리도 덜 말리고 뛰쳐나왔어요.","정류장까지 전력 질주. 버스가 막 출발하려고 해요.","겨우 탔어요. 창가에 서서 숨을 고르며 이어폰을 꽂아요."],["금요일 오후 5시 50분이에요.","일은 다 끝냈는데 시계가 정말 안 가요.","조용히 가방을 챙기고 이어폰을 꺼내 놔요.","6시. 회사 문을 나서는 순간부터 주말이에요."],["오늘 첫 월급이 들어왔어요.","통장 잔고를 몇 번이나 다시 확인했어요.","장바구니에 담아 둔 앨범이랑 시즌 그리팅, 결제 버튼 앞이에요.","결제 완료. 혼자 괜히 웃음이 나요."],["새벽 2시, 과제 마감까지 한 시간 남았어요.","화면엔 커서만 깜빡이고, 아직 반도 못 썼어요.","커피는 벌써 세 잔째예요. 그래도 포기는 안 해요.","정신 차리려고 볼륨을 올려요."],["한겨울 퇴근길, 손이 얼 것 같아요.","골목에서 붕어빵을 샀어요. 봉투가 따뜻해요.","고개를 들었는데 눈이 내리기 시작해요. 첫눈이에요.","붕어빵 하나 꺼내 먹으면서 천천히 걸어요."],["여름휴가 출발이에요. 비행기에 탔어요.","창가 자리, 엔진 소리가 점점 커져요.","곧 이륙한대요. 비행기 모드 켜기 직전이에요.","비행기가 천천히 활주로를 달리기 시작해요."],["오늘은 좀 지치는 날이었어요.","누구한테 말하기도 애매해서 그냥 걸어서 집에 가기로 했어요.","가로등이 하나둘 켜지고, 바람이 조금 차가워요.","이어폰을 꽂고 셔플을 눌러요."],["밤 11시 59분, 내 생일 1분 전이에요.","휴대폰 시계만 보고 있어요.","12시가 되자 단톡방에 축하 메시지가 쏟아져요.","혼자 피식 웃으면서 이어폰을 꽂아요."],["밤 11시 58분. 자정에 엔믹스 컴백 티저가 떠요.","새로고침만 계속 누르고 있어요.","단톡방은 이미 난리예요.","남은 2분, 그냥 기다릴 순 없죠."],["음악방송 1위 발표 직전이에요.","두 팀이 나란히 서 있고, 점수가 올라가고 있어요.","두 손을 꼭 모으고 숨도 못 쉬어요.","그리고 화면에 엔믹스 이름이 떠요."],["노래방이에요. 친구가 마이크를 넘겨요.","다들 나만 보고 있어요.","예약 번호를 누르려는데 손이 멈칫해요.","그때 반주가 흘러나와요."],["러닝머신 위, 마지막 10분 남았어요.","다리는 무겁고 숨은 턱까지 찼어요.","그만둘까 하다가 거울 속 내 얼굴을 봐요. 오늘은 끝까지 가요.","마지막 스퍼트, 플레이리스트를 넘겨요."],["대청소를 끝냈어요. 세 시간 걸렸어요.","창문을 활짝 열었더니 바람이 시원하게 들어와요.","깨끗한 바닥, 정리된 책상, 새로 빤 이불.","소파에 털썩 앉아서 스피커를 켜요."],["봄이에요. 벚꽃길을 걷고 있어요.","바람이 불 때마다 꽃잎이 흩날려요.","다들 사진 찍느라 바쁘고, 나도 한 장 찍었어요.","바람이 한 번 더 불어요."],["캠핑장, 해가 지고 불을 피웠어요.","마시멜로를 꽂아서 천천히 굽고 있어요.","하늘엔 별이 가득하고, 장작이 타닥타닥 타요.","친구가 스피커를 켜요."],["처음 와 본 도시예요. 호텔에 체크인했어요.","커튼을 걷으니까 야경이 펼쳐져요.","낯선 불빛을 보고 있으니 기분이 묘해요.","창가에 서서 이어폰을 꽂아요."],["면접 대기실이에요. 내 차례까지 5분 남았어요.","손에 땀이 나고, 준비한 답이 머릿속에서 섞여요.","심호흡 한 번 하고 옷매무새를 다시 정리해요.","눈을 감고 이어폰을 꽂아요."],["공항이에요. 비행기가 4시간 연착됐대요.","면세점도 다 돌았고 커피도 두 잔 마셨어요.","창밖으로 다른 비행기들만 뜨고 내려요.","의자에 기대서 이어폰을 꽂아요."],["여름, 시골 할머니 댁이에요.","마루에 누워서 수박을 먹고 있어요. 매미 소리가 시끄러워요.","할머니가 부채질해 주시면서 더 먹으라고 하세요.","마루 끝에 둔 휴대폰에서 노래가 흘러나와요."],["12월 31일, 새해 카운트다운이에요.","10, 9, 8, 다들 숫자를 외치고 있어요.","돌아보면 올해도 엔믹스 덕분에 버틴 날이 많았어요.","0이 되는 순간, 이어폰을 꽂아요."],["첫 출근 날, 엘리베이터 안이에요.","사원증이 아직 어색해요.","층수가 올라갈수록 심장이 빨리 뛰어요.","문이 열리기 직전, 심호흡을 해요."],["콘서트가 끝났어요. 막차에 겨우 탔어요.","가방 속 응원봉이 아직 켜져 있어요.","목은 다 쉬었고 다리는 후들거리는데, 마음은 꽉 찼어요.","창밖을 보며 이어폰을 꽂아요."],["밤 11시, 결국 치킨을 시켰어요.","배달 앱 지도에서 오토바이가 우리 집으로 오고 있어요.","초인종이 울려요. 냄새가 벌써 현관까지 왔어요.","닭다리 하나 들고 휴대폰을 켜요."]],en:[["Okay, picture this.","You wake up five minutes before your alarm. That never happens.","You make a cup of coffee and open the window. The morning air feels cool and fresh.","Then your phone buzzes. It's a bubble message from HAEWON.","You can't stop smiling. Somehow, today feels like it's going to go well."],["You got scolded at work today. The day felt extra long.","On the subway home, you luckily get a seat.","The Han River slides past the window as the sun sets.","You put your earphones in. A little reward for making it through today."],["The concert is finally tomorrow. You've waited months for this.","Fresh batteries in the lightstick, outfit all picked out.","But you can't sleep. Your heart is already at the venue.","Lights off, you lie there replaying tomorrow's stage in your head."],["A weekend afternoon. Windows down, driving along the coast.","The wind tangles your hair, and you don't even mind.","On your right, the sea sparkles in the sun.",'Your partner in the passenger seat asks, "Which NMIXX song should we play?"'],["It's a rainy night. Raindrops patter against the window.","A warm cup of tea beside you, you curl up under the blanket.","You've decided to do nothing tonight. Notifications all off.","A night for nothing but music."],["You've just showered and gotten into bed when a text arrives. You won a spot at the fan sign.","You read it twice, three times. You screenshot it and send it to a friend.","You keep typing and deleting what you want to say in your notes app.","Sleep? Not happening tonight."],["Your last exam is finally over.","You step out of the building and the sky is unusually clear.","Tomorrow you can sleep without an alarm.","On the way to eat with friends, someone turns on a speaker."],["Monday morning. You hit snooze five times.","You open your eyes: 8:10. You run out the door with your hair still wet.","A full sprint to the bus stop. The bus is just about to leave.","You make it. Standing by the window, catching your breath, you put your earphones in."],["It's 5:50 on Friday afternoon.","Your work is all done, but the clock just won't move.","You quietly pack your bag and get your earphones ready.","6:00. The moment you walk out the office door, it's the weekend."],["Your first paycheck came in today.","You checked your bank balance more times than you can count.","The albums and season's greetings in your cart, your finger over the checkout button.","Payment complete. You can't help grinning to yourself."],["2 a.m. One hour until the assignment is due.","The cursor just blinks on the screen. You're not even halfway done.","You're on your third coffee already. But you're not giving up.","You turn the volume up to stay awake."],["Heading home in the dead of winter, your hands feel frozen.","You buy some fish-shaped pastries from a street stall. The bag is warm.","You look up and snow is starting to fall. It's the first snow of the year.","You take one out and walk slowly, eating it."],["Summer vacation starts now. You're on the plane.","Window seat. The engines are getting louder.","Takeoff any minute now. You're just about to switch on airplane mode.","The plane slowly starts rolling down the runway."],["Today was a draining day.","It's hard to explain to anyone, so you decide to just walk home.","The streetlights come on one by one, and the wind is a little chilly.","You put your earphones in and hit shuffle."],["11:59 p.m. One minute until your birthday.","You can't stop staring at the clock on your phone.","At midnight, birthday messages flood the group chat.","Smiling to yourself, you put your earphones in."],["11:58 p.m. NMIXX's comeback teaser drops at midnight.","You keep hitting refresh.","The group chat is already going wild.","Two minutes left. You can't just sit there and wait."],["It's the moment before the music show announces first place.","Two groups stand side by side as the scores climb.","Hands clasped tight, you can barely breathe.","And then NMIXX's name appears on the screen."],["You're at karaoke. Your friend passes you the mic.","Everyone's looking at you.","You go to punch in a song number, but your hand freezes.","Then the backing track starts playing."],["On the treadmill, ten minutes to go.","Your legs are heavy and you're completely out of breath.","You think about quitting, then catch your own face in the mirror. Today you're going all the way.","Final sprint. You skip to the next song."],["You finished a big clean. It took three hours.","You throw the windows open and a cool breeze comes in.","Clean floors, a tidy desk, freshly washed bedding.","You flop onto the sofa and turn on the speaker."],["It's spring. You're walking down a street lined with cherry blossoms.","Every time the wind blows, petals scatter through the air.","Everyone is busy taking photos, and you take one too.","The wind blows one more time."],["At the campsite, the sun has set and the fire is lit.","You're slowly toasting a marshmallow on a stick.","The sky is full of stars and the firewood crackles.","Your friend turns on the speaker."],["A city you've never been to. You just checked into the hotel.","You pull back the curtains and the night view spreads out before you.","Looking at the unfamiliar lights gives you a strange feeling.","Standing by the window, you put your earphones in."],["You're in the interview waiting room. Five minutes until your turn.","Your palms are sweaty, and the answers you prepared are getting jumbled in your head.","You take a deep breath and straighten your clothes once more.","You close your eyes and put your earphones in."],["You're at the airport. Your flight is delayed four hours.","You've been through every duty-free shop and had two coffees.","Out the window, only other planes take off and land.","You lean back in your seat and put your earphones in."],["Summer at your grandma's house in the countryside.","You're lying on the wooden porch eating watermelon. The cicadas are loud.","Grandma fans you and tells you to have some more.","A song starts playing from the phone at the edge of the porch."],["December 31st. It's the New Year countdown.","10, 9, 8... everyone is shouting the numbers.","Looking back, there were a lot of days this year you got through thanks to NMIXX.","The moment it hits zero, you put your earphones in."],["First day at a new job. You're in the elevator.","Your employee ID badge still feels strange.","The higher the floor number climbs, the faster your heart beats.","Right before the doors open, you take a deep breath."],["The concert is over. You barely made the last train.","The lightstick in your bag is still on.","Your voice is gone and your legs are shaking, but your heart is full.","Looking out the window, you put your earphones in."],["11 p.m. You gave in and ordered fried chicken.","On the delivery app map, the motorbike is heading to your place.","The doorbell rings. The smell has already reached the front door.","Drumstick in hand, you unlock your phone."]],ja:[["さあ、想像してみてください。","アラームより5分早く目が覚めました。こんな日、なかなかないですよね。","コーヒーを一杯いれて窓を開けます。朝の空気がひんやり入ってきます。","そのときスマホに通知が来ます。HAEWONからのバブルです。","思わず笑顔になります。今日はなんだかうまくいきそうです。"],["今日は会社でちょっと怒られました。やけに長い一日でした。","帰りの地下鉄、運よく席が空きました。","窓の外を漢江が流れていき、夕日が沈んでいきます。","イヤホンを耳に入れます。今日を乗り切った自分へのごほうびです。"],["明日はいよいよコンサートです。何か月も待ちました。","ペンライトの電池も替えて、着ていく服も決めました。","でも眠れません。心はもう会場にいます。","電気を消して横になり、明日のステージを何度も思い浮かべます。"],["週末の午後、窓を開けて海沿いの道を走ります。","風で髪がぐしゃぐしゃになるけれど、それさえ気持ちいいです。","右側では、海が日差しにきらめいています。","助手席の恋人が聞きます。「NMIXX、何かける?」"],["雨の夜です。窓に雨粒がぽつぽつ当たります。","温かいお茶をそばに置いて、布団にもぐり込みました。","今日は何もしないと決めました。通知も全部オフにしました。","ただ音楽だけ聴いていたい夜です。"],["お風呂を済ませて横になったら、メッセージが届きました。サイン会当選です。","二度、三度と読み返します。スクショして友だちに送りました。","何を話すか、メモ帳に書いては消してを繰り返します。","今夜はもう眠れそうにありません。"],["ついに最後の試験が終わりました。","建物の外に出ると、空がやけに青く澄んでいます。","明日はアラームなしで寝ていられます。","友だちとごはんを食べに行く途中、誰かがスピーカーをつけます。"],["月曜の朝、アラームを5回止めました。","目を開けたら8時10分。髪も乾かしきらずに飛び出しました。","バス停まで全力ダッシュ。バスがちょうど出ようとしています。","なんとか乗れました。窓際に立って息を整えながら、イヤホンを入れます。"],["金曜日の午後5時50分です。","仕事は全部終わったのに、時計がまったく進みません。","こっそりカバンを片づけて、イヤホンを出しておきます。","6時。会社のドアを出た瞬間から週末です。"],["今日、初めてのお給料が入りました。","口座の残高を何度も確認しました。","カートに入れておいたアルバムとシーズングリーティング。決済ボタンの前です。","決済完了。ひとりでにやけてしまいます。"],["深夜2時、課題の締め切りまであと1時間です。","画面ではカーソルが点滅しているだけです。まだ半分も書けていません。","コーヒーはもう3杯目です。それでもあきらめません。","目を覚まそうと、音量を上げます。"],["真冬の帰り道、手が凍えそうです。","路地でたい焼きを買いました。袋があったかいです。","顔を上げると、雪が降り始めました。初雪です。","たい焼きをひとつ取り出して、食べながらゆっくり歩きます。"],["夏休みの出発です。飛行機に乗りました。","窓側の席、エンジンの音がだんだん大きくなります。","まもなく離陸だそうです。機内モードにする直前です。","飛行機がゆっくりと滑走路を走り始めます。"],["今日はちょっと疲れる一日でした。","誰かに話すのもなんだか違う気がして、歩いて帰ることにしました。","街灯がひとつずつ灯り、風が少し冷たいです。","イヤホンをつけて、シャッフルを押します。"],["夜11時59分、誕生日の1分前です。","スマホの時計ばかり見ています。","0時になった瞬間、グループトークにお祝いメッセージが殺到します。","ひとりでふっと笑いながら、イヤホンを入れます。"],["夜11時58分。0時にNMIXXのカムバックティザーが公開されます。","ひたすら更新ボタンを押しています。","グループトークはもう大騒ぎです。","残り2分、ただ待ってなんかいられません。"],["音楽番組の1位発表の直前です。","2組が並んで立ち、スコアが上がっていきます。","両手をぎゅっと握って、息もできません。","そして画面にNMIXXの名前が映ります。"],["カラオケです。友だちがマイクを渡してきます。","みんなが自分だけを見ています。","曲番号を押そうとして、手が止まります。","そのとき、イントロが流れてきます。"],["ランニングマシンの上、残り10分です。","足は重くて、息はもう限界です。","やめようかと思いましたが、鏡に映る自分の顔を見ます。今日は最後まで走ります。","ラストスパート、次の曲へ送ります。"],["大掃除が終わりました。3時間かかりました。","窓を全開にすると、風が気持ちよく入ってきます。","きれいな床、片づいた机、洗いたての布団。","ソファにどさっと座って、スピーカーをつけます。"],["春です。桜並木を歩いています。","風が吹くたびに、花びらが舞い散ります。","みんな写真を撮るのに夢中で、わたしも1枚撮りました。","もう一度、風が吹きます。"],["キャンプ場、日が沈んで火をおこしました。","マシュマロを串に刺して、ゆっくり焼いています。","空には星がいっぱい、薪がパチパチと燃えています。","友だちがスピーカーをつけます。"],["初めて来た街です。ホテルにチェックインしました。","カーテンを開けると、夜景が広がります。","見慣れない灯りを眺めていると、不思議な気分になります。","窓辺に立って、イヤホンを入れます。"],["面接の待合室です。自分の番まであと5分です。","手に汗がにじんで、準備した答えが頭の中でごちゃごちゃになります。","深呼吸をひとつして、身だしなみをもう一度整えます。","目を閉じて、イヤホンを入れます。"],["空港です。飛行機が4時間遅れるそうです。","免税店も全部回ったし、コーヒーも2杯飲みました。","窓の外では、ほかの飛行機ばかりが飛び立っては降りてきます。","椅子にもたれて、イヤホンを入れます。"],["夏、田舎のおばあちゃんの家です。","縁側に寝転んでスイカを食べています。セミの声がにぎやかです。","おばあちゃんがうちわであおぎながら、もっと食べなさいと言います。","縁側の端に置いたスマホから、歌が流れてきます。"],["12月31日、新年のカウントダウンです。","10、9、8、みんなが数字を叫んでいます。","振り返ると、今年もNMIXXのおかげで乗り越えられた日がたくさんありました。","0になった瞬間、イヤホンを入れます。"],["初出勤の日、エレベーターの中です。","社員証がまだしっくりきません。","階数が上がるほど、心臓がドキドキします。","ドアが開く直前、深呼吸をします。"],["コンサートが終わりました。終電にぎりぎり間に合いました。","カバンの中のペンライトがまだ光っています。","声はすっかりかれて足もガクガクですが、心は満たされています。","窓の外を眺めながら、イヤホンを入れます。"],["夜11時、結局チキンを頼んでしまいました。","配達アプリの地図で、バイクがうちに向かっています。","インターホンが鳴ります。においがもう玄関まで来ています。","チキンのレッグを片手に、スマホをつけます。"]],zh:[["来，想象一下。","比闹钟早五分钟醒来了。这种日子可不多见。","冲一杯咖啡，打开窗户。清凉的晨风吹了进来。","这时手机响了，是HAEWON的Bubble。","不自觉地笑了出来。今天好像会很顺利。"],["今天在公司挨了点骂，这一天格外漫长。","下班的地铁上，运气好有了座位。","窗外汉江流过，夕阳正在落下。","戴上耳机。这是给撑过今天的自己的奖励。"],["明天终于是演唱会了，等了好几个月。","应援棒换好了新电池，要穿的衣服也挑好了。","可是睡不着，心早就飞到会场了。","关上灯躺着，一遍遍想象明天的舞台。"],["周末下午，摇下车窗，沿着海边公路开车。","头发被风吹得乱七八糟，但这样也挺好。","右边的大海在阳光下闪闪发光。","副驾驶座上的另一半问：「放哪首NMIXX的歌?」"],["下雨的夜晚，雨滴噼里啪啦地打在窗上。","旁边放一杯热茶，钻进被窝里。","今天决定什么都不做，通知也全关了。","只想听歌的夜晚。"],["洗完澡刚躺下，就收到了短信：签售会中签了。","看了两遍、三遍，截图发给了朋友。","想说的话在备忘录里写了又删，删了又写。","今晚是别想睡了。"],["最后一场考试终于结束了。","走出教学楼，天空格外晴朗。","明天可以不定闹钟睡到自然醒。","和朋友们去吃饭的路上，有人打开了音箱。"],["周一早上，闹钟按掉了五次。","睁眼一看已经8点10分，头发没吹干就冲出了门。","一路狂奔到车站，公交车正要开走。","总算赶上了。站在窗边喘口气，戴上耳机。"],["周五下午5点50分。","工作都做完了，可时间就是过得特别慢。","悄悄收拾好包，把耳机拿出来。","6点。走出公司大门的那一刻，周末开始了。"],["今天第一份工资到账了。","反复查看了好几次银行余额。","购物车里的专辑和季节问候，手指停在付款按钮上。","付款成功。一个人忍不住偷笑。"],["凌晨2点，离作业截止还有一个小时。","屏幕上只有光标在闪，还没写到一半。","咖啡已经是第三杯了，但还是不放弃。","为了打起精神，把音量调大。"],["隆冬的下班路上，手冻得快没知觉了。","在巷子里买了鲷鱼烧，纸袋暖暖的。","一抬头，开始下雪了。是初雪。","拿出一个鲷鱼烧，边吃边慢慢走。"],["暑假出发了，登上了飞机。","靠窗的座位，引擎声越来越大。","马上就要起飞了，正准备打开飞行模式。","飞机慢慢地开始在跑道上滑行。"],["今天有点累。","跟谁说都觉得不太对，干脆走路回家。","路灯一盏盏亮起，风有点凉。","戴上耳机，按下随机播放。"],["晚上11点59分，离生日还有一分钟。","一直盯着手机上的时间。","一到12点，群聊里的生日祝福刷屏了。","一个人偷偷笑着，戴上耳机。"],["晚上11点58分，零点NMIXX的回归预告就要发布了。","一直在狂按刷新。","群聊里已经炸开了锅。","还剩2分钟，可不能干等着。"],["音乐节目一位公布前的那一刻。","两组并排站着，分数不断上升。","双手紧紧合十，连呼吸都不敢。","然后，屏幕上出现了NMIXX的名字。"],["在KTV，朋友把麦克风递了过来。","大家都在看着我。","正要点歌，手却停住了。","这时，伴奏响了起来。"],["在跑步机上，还剩最后10分钟。","腿越来越沉，喘得上气不接下气。","正想放弃，看到镜子里的自己。今天要坚持到底。","最后冲刺，切到下一首歌。"],["大扫除结束了，花了三个小时。","把窗户全打开，凉风吹了进来。","干净的地板，整齐的书桌，刚洗好的被子。","一屁股坐到沙发上，打开音箱。"],["春天到了，走在樱花路上。","每当风吹过，花瓣就随风飘落。","大家都忙着拍照，我也拍了一张。","风又吹了一次。"],["露营地，太阳下山后生起了火。","把棉花糖串起来，慢慢地烤。","满天星星，柴火噼啪作响。","朋友打开了音箱。"],["第一次来的城市，在酒店办好了入住。","拉开窗帘，夜景在眼前展开。","看着陌生的灯光，心情有点微妙。","站在窗边，戴上耳机。"],["在面试等候室，离轮到我还有5分钟。","手心冒汗，准备好的答案在脑子里乱成一团。","深呼吸一下，再整理一次衣服。","闭上眼睛，戴上耳机。"],["在机场，航班晚点了4个小时。","免税店都逛遍了，咖啡也喝了两杯。","窗外只有别的飞机在起起落落。","靠在椅子上，戴上耳机。"],["夏天，在乡下外婆家。","躺在木地板上吃西瓜，蝉鸣声吵个不停。","外婆一边给我扇扇子，一边让我多吃点。","放在地板边上的手机里传出了歌声。"],["12月31日，新年倒计时。","10、9、8，大家都在大声倒数。","回头看看，今年也有很多日子是靠NMIXX撑过来的。","数到0的那一刻，戴上耳机。"],["第一天上班，在电梯里。","工牌戴着还有点别扭。","楼层越往上，心跳就越快。","电梯门打开前，深吸一口气。"],["演唱会结束了，勉强赶上了末班车。","包里的应援棒还亮着。","嗓子全哑了，腿也在发抖，可心里满满的。","望着窗外，戴上耳机。"],["晚上11点，最后还是点了炸鸡。","外卖软件的地图上，摩托车正朝我家开来。","门铃响了，香味已经飘到了门口。","拿起一只鸡腿，打开手机。"]],zht:[["來，想像一下。","比鬧鐘早五分鐘醒來了。這種日子可不多見。","沖一杯咖啡，打開窗戶。清涼的晨風吹了進來。","這時手機響了，是HAEWON的Bubble。","不自覺地笑了出來。今天好像會很順利。"],["今天在公司被罵了一下，這一天特別漫長。","下班的捷運上，運氣好有了座位。","窗外漢江流過，夕陽正在落下。","戴上耳機。這是給撐過今天的自己的獎勵。"],["明天終於是演唱會了，等了好幾個月。","應援棒換好了新電池，要穿的衣服也挑好了。","可是睡不著，心早就飛到會場了。","關上燈躺著，一遍遍想像明天的舞台。"],["週末下午，搖下車窗，沿著海邊公路開車。","頭髮被風吹得亂七八糟，但這樣也挺好。","右邊的大海在陽光下閃閃發光。","副駕駛座上的另一半問：「放哪首NMIXX的歌?」"],["下雨的夜晚，雨滴劈哩啪啦地打在窗上。","旁邊放一杯熱茶，鑽進被窩裡。","今天決定什麼都不做，通知也全關了。","只想聽歌的夜晚。"],["洗完澡剛躺下，就收到了簡訊：簽售會中籤了。","看了兩遍、三遍，截圖傳給了朋友。","想說的話在備忘錄裡寫了又刪，刪了又寫。","今晚是別想睡了。"],["最後一場考試終於結束了。","走出教學大樓，天空格外晴朗。","明天可以不設鬧鐘睡到自然醒。","和朋友們去吃飯的路上，有人打開了喇叭。"],["週一早上，鬧鐘按掉了五次。","睜眼一看已經8點10分，頭髮沒吹乾就衝出了門。","一路狂奔到站牌，公車正要開走。","總算趕上了。站在窗邊喘口氣，戴上耳機。"],["週五下午5點50分。","工作都做完了，可時間就是過得特別慢。","悄悄收拾好包包，把耳機拿出來。","6點。走出公司大門的那一刻，週末開始了。"],["今天第一份薪水入帳了。","反覆查看了好幾次銀行餘額。","購物車裡的專輯和季節問候，手指停在付款按鈕上。","付款成功。一個人忍不住偷笑。"],["凌晨2點，離作業截止還有一個小時。","螢幕上只有游標在閃，還沒寫到一半。","咖啡已經是第三杯了，但還是不放棄。","為了打起精神，把音量調大。"],["寒冬的下班路上，手凍得快沒知覺了。","在巷子裡買了鯛魚燒，紙袋暖暖的。","一抬頭，開始下雪了。是初雪。","拿出一個鯛魚燒，邊吃邊慢慢走。"],["暑假出發了，登上了飛機。","靠窗的座位，引擎聲越來越大。","馬上就要起飛了，正準備打開飛航模式。","飛機慢慢地開始在跑道上滑行。"],["今天有點累。","跟誰說都覺得不太對，乾脆走路回家。","路燈一盞盞亮起，風有點涼。","戴上耳機，按下隨機播放。"],["晚上11點59分，離生日還有一分鐘。","一直盯著手機上的時間。","一到12點，群組裡的生日祝福洗版了。","一個人偷偷笑著，戴上耳機。"],["晚上11點58分，零點NMIXX的回歸預告就要發布了。","一直在狂按重新整理。","群組裡已經炸開了鍋。","還剩2分鐘，可不能乾等著。"],["音樂節目一位公布前的那一刻。","兩組並排站著，分數不斷上升。","雙手緊緊合十，連呼吸都不敢。","然後，螢幕上出現了NMIXX的名字。"],["在KTV，朋友把麥克風遞了過來。","大家都在看著我。","正要點歌，手卻停住了。","這時，伴奏響了起來。"],["在跑步機上，還剩最後10分鐘。","腿越來越沉，喘得上氣不接下氣。","正想放棄，看到鏡子裡的自己。今天要堅持到底。","最後衝刺，切到下一首歌。"],["大掃除結束了，花了三個小時。","把窗戶全打開，涼風吹了進來。","乾淨的地板，整齊的書桌，剛洗好的被子。","一屁股坐到沙發上，打開喇叭。"],["春天到了，走在櫻花路上。","每當風吹過，花瓣就隨風飄落。","大家都忙著拍照，我也拍了一張。","風又吹了一次。"],["露營區，太陽下山後生起了火。","把棉花糖串起來，慢慢地烤。","滿天星星，柴火劈啪作響。","朋友打開了喇叭。"],["第一次來的城市，在飯店辦好了入住。","拉開窗簾，夜景在眼前展開。","看著陌生的燈光，心情有點微妙。","站在窗邊，戴上耳機。"],["在面試等候室，離輪到我還有5分鐘。","手心冒汗，準備好的答案在腦子裡亂成一團。","深呼吸一下，再整理一次衣服。","閉上眼睛，戴上耳機。"],["在機場，班機延誤了4個小時。","免稅店都逛遍了，咖啡也喝了兩杯。","窗外只有別的飛機在起起落落。","靠在椅子上，戴上耳機。"],["夏天，在鄉下外婆家。","躺在木地板上吃西瓜，蟬鳴聲吵個不停。","外婆一邊幫我搧扇子，一邊叫我多吃點。","放在地板邊上的手機裡傳出了歌聲。"],["12月31日，新年倒數。","10、9、8，大家都在大聲倒數。","回頭看看，今年也有很多日子是靠NMIXX撐過來的。","數到0的那一刻，戴上耳機。"],["第一天上班，在電梯裡。","識別證戴著還有點彆扭。","樓層越往上，心跳就越快。","電梯門打開前，深吸一口氣。"],["演唱會結束了，勉強趕上了末班車。","包包裡的應援棒還亮著。","嗓子全啞了，腿也在發抖，可心裡滿滿的。","望著窗外，戴上耳機。"],["晚上11點，最後還是點了炸雞。","外送App的地圖上，機車正朝我家騎來。","門鈴響了，香味已經飄到了門口。","拿起一隻雞腿，打開手機。"]],es:[["A ver, imagínate esto.","Te despiertas cinco minutos antes de la alarma. Eso casi nunca pasa.","Te preparas un café y abres la ventana. Entra el aire fresco de la mañana.","Justo entonces suena el móvil. Es un mensaje de bubble de HAEWON.","Sonríes sin querer. Algo te dice que hoy todo va a salir bien."],["Hoy te regañaron un poco en el trabajo. El día se hizo eterno.","En el metro de vuelta a casa, por suerte, consigues asiento.","Por la ventana pasa el río Han y el sol se está poniendo.","Te pones los auriculares. Es tu premio por aguantar el día."],["Mañana por fin es el concierto. Llevas meses esperando.","Pilas nuevas en el lightstick y la ropa ya elegida.","Pero no hay manera de dormir. Tu cabeza ya está en el concierto.","Apagas la luz y te imaginas una y otra vez el escenario de mañana."],["Tarde de fin de semana, ventanas abajo, conduciendo junto al mar.","El viento te enreda el pelo, pero hasta eso te gusta.","A la derecha, el mar brilla bajo el sol.",'Tu pareja, en el asiento del copiloto, pregunta: "¿Qué canción de NMIXX ponemos?"'],["Es una noche de lluvia. Las gotas golpean la ventana.","Con un té caliente al lado, te metes bajo la manta.","Hoy decidiste no hacer nada. Hasta apagaste las notificaciones.","Es una noche solo para escuchar música."],["Te acabas de duchar y acostar cuando llega un mensaje: ganaste un lugar en la firma de autógrafos.","Lo lees dos, tres veces. Haces una captura y se la mandas a tus amigos.","Escribes y borras en las notas lo que quieres decir.","Esta noche, de dormir, nada."],["Por fin terminó el último examen.","Sales del edificio y el cielo está más despejado que nunca.","Mañana puedes dormir sin alarma.","De camino a comer con tus amigos, alguien pone música en un altavoz."],["Lunes por la mañana. Apagaste la alarma cinco veces.","Abres los ojos: las 8:10. Sales corriendo con el pelo a medio secar.","Carrera a toda velocidad hasta la parada. El autobús está a punto de irse.","Lo alcanzas por los pelos. De pie junto a la ventana, recuperas el aliento y te pones los auriculares."],["Viernes, 5:50 de la tarde.","Ya terminaste todo, pero el reloj no avanza.","Recoges tus cosas en silencio y dejas los auriculares a mano.","Las 6. En cuanto cruzas la puerta de la oficina, empieza el fin de semana."],["Hoy cobraste tu primer sueldo.","Revisaste el saldo de la cuenta un montón de veces.","Los álbumes y el season's greetings en el carrito, el dedo sobre el botón de pagar.","Pago completado. Se te escapa una sonrisa."],["Las 2 de la madrugada. Queda una hora para entregar el trabajo.","En la pantalla solo parpadea el cursor, y aún no llevas ni la mitad.","Ya vas por el tercer café. Pero no te rindes.","Subes el volumen para espabilarte."],["Volviendo a casa en pleno invierno, se te congelan las manos.","En un callejón compras unos pastelitos con forma de pez. La bolsa está calentita.","Levantas la vista y empieza a nevar. Es la primera nevada.","Sacas un pastelito y caminas despacio mientras te lo comes."],["Empiezan las vacaciones de verano. Ya estás en el avión.","Asiento de ventanilla. El ruido de los motores va subiendo.","Van a despegar enseguida. Estás a punto de activar el modo avión.","El avión empieza a rodar despacio por la pista."],["Hoy fue un día agotador.","No sabes ni a quién contárselo, así que decides volver a casa caminando.","Las farolas se van encendiendo una a una y el viento está algo frío.","Te pones los auriculares y le das a aleatorio."],["Las 23:59. Falta un minuto para tu cumpleaños.","No dejas de mirar la hora en el móvil.","A las 12, el chat del grupo se llena de felicitaciones.","Con una sonrisa, te pones los auriculares."],["Las 23:58. A medianoche sale el teaser del comeback de NMIXX.","No paras de darle a actualizar.","El chat del grupo ya está que arde.","Quedan dos minutos. No puedes quedarte sin hacer nada."],["Justo antes de que el programa musical anuncie el primer puesto.","Dos grupos esperan uno al lado del otro mientras suben los puntos.","Con las manos juntas, casi no puedes ni respirar.","Y entonces aparece en pantalla el nombre de NMIXX."],["Estás en el karaoke. Te pasan el micrófono.","Todo el mundo te está mirando.","Vas a marcar el número de una canción, pero la mano se te queda quieta.","Y justo entonces empieza a sonar la música."],["En la cinta de correr, quedan los últimos diez minutos.","Las piernas te pesan y te falta el aire.","Piensas en dejarlo, pero ves tu cara en el espejo. Hoy llegas hasta el final.","Sprint final. Pasas a la siguiente canción."],["Terminaste la limpieza a fondo. Te llevó tres horas.","Abres las ventanas de par en par y entra una brisa fresca.","El suelo limpio, el escritorio ordenado, las sábanas recién lavadas.","Te dejas caer en el sofá y enciendes el altavoz."],["Es primavera. Paseas por una calle llena de cerezos en flor.","Cada vez que sopla el viento, los pétalos vuelan por el aire.","Todo el mundo está haciendo fotos, y tú también haces una.","El viento vuelve a soplar."],["En el camping, ya se puso el sol y encendieron el fuego.","Tuestas despacio un malvavisco en un palito.","El cielo está lleno de estrellas y la leña crepita.","Alguien del grupo enciende el altavoz."],["Una ciudad que no conocías. Acabas de hacer el check-in en el hotel.","Abres las cortinas y aparecen las luces de la ciudad de noche.","Mirar esas luces desconocidas te da una sensación extraña.","De pie junto a la ventana, te pones los auriculares."],["Estás en la sala de espera de una entrevista. Faltan cinco minutos para tu turno.","Te sudan las manos y las respuestas que preparaste se te mezclan en la cabeza.","Respiras hondo y te vuelves a arreglar la ropa.","Cierras los ojos y te pones los auriculares."],["Estás en el aeropuerto. Tu vuelo lleva cuatro horas de retraso.","Ya recorriste todas las tiendas libres de impuestos y te tomaste dos cafés.","Por la ventana solo ves despegar y aterrizar otros aviones.","Te recuestas en el asiento y te pones los auriculares."],["Verano en casa de la abuela, en el pueblo.","Te tumbas en el porche de madera a comer sandía. Las chicharras no paran.","La abuela te abanica y te dice que comas más.","Del móvil que dejaste al borde del porche empieza a salir una canción."],["31 de diciembre. Cuenta atrás para el Año Nuevo.","10, 9, 8... todo el mundo grita los números.","Si lo piensas, este año también hubo muchos días que superaste gracias a NMIXX.","Justo cuando llega a cero, te pones los auriculares."],["Primer día de trabajo. Estás en el ascensor.","La tarjeta de empleado todavía se te hace rara.","Cuanto más suben los pisos, más rápido late tu corazón.","Justo antes de que se abran las puertas, respiras hondo."],["Se acabó el concierto. Llegaste al último tren por los pelos.","El lightstick sigue encendido dentro de la mochila.","Te quedaste sin voz y te tiemblan las piernas, pero tienes el corazón lleno.","Mirando por la ventana, te pones los auriculares."],["Las 11 de la noche. Al final pediste pollo frito.","En el mapa de la
