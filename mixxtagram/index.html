m_d7VsAAKMGb","jpg"]],a:"NMIXX_official"},{id:"igCloQ5uCPidY",t:"2022-12-01T14:44:22Z",m:["kyujin"],x:"안녕하세요 엔써🤍\n이번에 저희 엔믹스가 첫 시상식인 2022 마마 어워즈에서 첫 수상을 하게 되었는데요, 정말 소중하고 뜻깊은 날로 기억될 것 같아요🙂 저희에게 관심과 사랑을 주신 엔써 여러분 정말 감사하고 사랑해요! 그리고 저희가 앞으로 더 보여드릴 다양한 음악과 모습 많이 기대해주셨으면 좋겠습니다. 앞으로 더 잘할게요😚 또, 이 과정에 오기까지 저희와 함께 해주시고 도움주신 SQU4D 직원 언니 오빠들, 헤메스 실장님들과 스텝 언니들 정말 감사합니다💙 저희의 성장 과정 계속해서 잘 지켜봐주세요!\n\n#NMIXX #엔믹스 #규진 #KYUJIN\n#2022MAMAAWARDS\n#FavoriteNewArtist",ig:"CloQ5uCPidY",k:1},{id:"igClm3gcNvIDA",t:"2022-12-01T01:43:13Z",m:["haewon"],x:"안녕하세요 엔써! 해원입니다~\n엔믹스의 첫 연말 시상식! 마마 어워즈에서 저희의 무대를 펼칠 수 있는 것만으로도 뜻깊은 시간이었는데, 수상까지 하게 되어 무척 영광이었습니다.\n이 모든 게 다 엔믹스를 응원해 주고, 사랑해 주는 엔써 덕분입니다. 앞으로 엔써에게 자랑스러운 가수가 되기 위해 끊임없이 노력할 테니 지켜봐 주세요.\n\n수상은 처음이라.. 고마웠던 분들을 언급하지 못해 많이 아쉬웠습니다.\n\n매번 따뜻한 응원과 격려를 보내주시는 JYP 박진영 피디님 정욱 사장님 변상봉 부사장님 감사합니다!💙\n저희를 엔믹스로 탄생시켜주신 이지영 본부장님을 비롯한 4본부 식구들 SQU4D! 감사합니다.🔥멋진 무대를 위해 땀흘려주신 퍼디랩 언니오빠들과 댄서분들! 정말 감사합니다👍\n엔믹스 멤버 일곱 명의 부모님께도 감사 인사 전합니다.🤍 마지막으로 엔써 여러분! 저희는 엔써가 상상하는 것 이상으로! 엔써를 사랑합니다~!!! ❤️ 항상 고마워요!\n\n#NMIXX\n#엔믹스\n#HAEWON\n#해원",ig:"Clm3gcNvIDA"},{id:"igCllVnvVL494",t:"2022-11-30T11:27:53Z",m:["bae"],x:"엔써-! 2022 MAMA AWARDS 무대에 설 수 있었던 것만으로도 너무 영광이었고 행복했는데 Favorite New Artist 상까지 받게 되다니.. 저희가 이 상을 받을 수 있었던 건 모두 엔써 덕분이에요. 정말 감사합니다🥹 정말 아예 예상도 못 하고 있어서 하고 싶었던 말을 하나도 못하고 내려왔지 뭐예요.. 헤헤 저희가 멋진 무대를 만들 수 있도록 도와주신 관계자분들과 연습생 때부터 꿈꾸던 연말 무대에 설 수 있도록 해주신 MAMA AWARDS!! 정말 감사드립니다🥹 그리구!! 항상 곁에서 응원해 주고 사랑해 주는 우리 엔써-!! 엔써 너무 고마워요🥺\n더 성장하는 모습 보여드릴 수 있도록 앞으로도 열심히 하겠습니다.\n저희에게 연말에 잊지 못할 최고의 선물을 주셔서 감사해요😊☺️\n엔써 사랑해요🥰\n\n#NMIXX #엔믹스 #배이 #BAE\n#솔스타그램\n#2022MAMAAWARDS\n#FavoriteNewArtist\n#MyLoveNSWER #💛",ig:"CllVnvVL494",k:1},{id:"igCllQROOrMJl",t:"2022-11-30T10:41:07Z",m:["lily"],x:"사랑하는 엔써~ 저희가 2022 MAMA AWARDS에서 Favorite New Artist상을 받게 되었어요ㅠㅠ 진짜 너무 고맙고 사랑한다고 말씀드리고 싶고 엔써 덕분에 받은거라고 알아주셨으면 좋겠어요! 저희를 응원해주고 사랑해주셔서 너무 너무 감사합니다. 엔써 없었으면 저희가 NMIXX를 못했을거예요. 그래서 너무 감사합니다. 💝\n\nMy lovely NSWER~ We had the honour of receiving the Favorite New Artist award at the 2022 MAMA AWARDS!!! I just want to t
